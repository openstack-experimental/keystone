[package]
name = "soak"
description = "Long-running Raft soak test controller for keystone in k8s"
version = "0.1.0"
rust-version = "1.91"  # MSRV
edition = "2024"
publish = false

[package.metadata.dist]
dist = false

# Standalone crate (excluded from the main workspace, like tests/loadtest).
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "soak"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
