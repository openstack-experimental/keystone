[package]
name = "test_federation"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = false

[dependencies]
base64.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "http1"] }
eyre.workspace = true
keycloak = { version = "26.7" }
local-ip-address = { version = "0.6" }
openstack-keystone-api-types = { workspace = true, features = ["builder" ] }
reqwest = { workspace = true, features = ["json", "http2", "multipart", "gzip", "deflate", "cookies"] }
openstack-keystone-tls-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
thirtyfour = "0.37"
tracing.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing-test.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4" ]}

[[test]]
name = "keycloak"
path = "src/keycloak.rs"
test = false

[[test]]
name = "github"
path = "src/github.rs"
test = false

[[test]]
name = "dex"
path = "src/dex.rs"
test = false

[[test]]
name = "oauth2_federated"
path = "src/oauth2_federated.rs"
test = false
