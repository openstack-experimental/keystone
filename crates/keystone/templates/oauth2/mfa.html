{% extends "base.html" %}
{% block title %}{{ t("verification_code") }}{% endblock %}
{% block content %}
<h1>{{ t("verification_code") }}</h1>
<p>{{ t("requesting_access", client=client.name) }}</p>
<p>{{ t("enter_verification_code") }}</p>
<p class="error" id="error" aria-live="polite">{% if error %}{{ t(error) }}{% endif %}</p>
<form method="post" action="{{ action }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input type="hidden" name="factor" value="totp">
<label for="passcode">{{ t("verification_code") }}</label>
<input id="passcode" type="text" name="passcode" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" spellcheck="false" autofocus required>
<button type="submit">{{ t("verify") }}</button>
</form>
{% endblock %}
