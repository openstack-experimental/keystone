{% extends "base.html" %}
{% block title %}{{ t("authorize_application") }}{% endblock %}
{% block content %}
<h1>{{ t("authorize_application") }}</h1>
<p>{{ t("requesting_following", client=client.name) }}</p>
<ul>
{% for scope in scopes %}
<li>{{ scope }}</li>
{% endfor %}
</ul>
<form method="post" action="{{ action }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="actions">
<button type="submit" name="decision" value="allow" autofocus>{{ t("allow") }}</button>
<button type="submit" name="decision" value="deny" class="secondary">{{ t("deny") }}</button>
</div>
</form>
{% endblock %}
