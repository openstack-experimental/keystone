# English strings for the OAuth2 pages. `{name}` placeholders are filled by
# the template (`t("key", name=value)`). Copy this file to
# `<templates_dir>/locales/<lang>.toml` and translate the values to add a
# locale; keys missing from a locale fall back to this file.

sign_in = "Sign in"
sign_in_error = "Sign-in error"
