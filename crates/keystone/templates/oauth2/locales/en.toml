username = "Username"
password = "Password"
authorize_application = "Authorize application"
requesting_following = "{client} is requesting the following access:"
allow = "Allow"
deny = "Deny"
enter_code = "Enter code"
enter_code_help = "Enter the code displayed on your device."
code = "Code"
continue = "Continue"
device_connected = "Device connected"
request_denied = "Request denied"
granted_access = "You have granted {client} access. You may now close this window."
