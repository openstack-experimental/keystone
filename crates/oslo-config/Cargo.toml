[package]
name = "oslo-config"
description = "oslo.config style configuration engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true

[features]
default = ["vault"]
# Resolution of `vault://` references and the `[vault]` section.
vault = ["dep:serde_json", "dep:thiserror", "dep:url", "dep:vaultrs"]

[dependencies]
chrono = { workspace = true, features = ["now", "serde"] }
config = { workspace = true, features = ["async", "ini", "toml"] }
derive_builder.workspace = true
eyre.workspace = true
inventory.workspace = true
ipnet = { workspace = true }
notify = "8.2"
secrecy = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"], optional = true }
vaultrs = { workspace = true, optional = true }

[dev-dependencies]
httpmock.workspace = true
serial_test.workspace = true
temp-env = { workspace = true, features = ["async_closure"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Without `no-env-filter` the `traced_test` macro only captures events from
# the test crate itself, not the engine's.
tracing-test = { workspace = true, features = ["no-env-filter"] }

[lints]
workspace = true
