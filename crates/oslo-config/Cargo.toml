[package]
name = "oslo-config"
description = "oslo.config style configuration engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true

[features]
# Expose the Vault mock helpers to the tests of dependent crates.
test-util = ["dep:httpmock"]

[dependencies]
chrono = { workspace = true, features = ["now", "serde"] }
config = { workspace = true, features = ["async", "ini", "toml"] }
derive_builder.workspace = true
eyre.workspace = true
httpmock = { workspace = true, optional = true }
ipnet = { workspace = true }
notify = "8.2"
secrecy = { workspace = true, features = ["serde"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
vaultrs.workspace = true

[dev-dependencies]
httpmock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
