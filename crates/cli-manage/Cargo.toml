[package]
name = "openstack-keystone-cli-manage"
description = "OpenStack Keystone administrative CLI"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true

[[bin]]
name="keystone-manage"
path="src/main.rs"

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
comfy-table = "8.0"
eyre.workspace = true
futures.workspace = true
inventory.workspace = true
openstack-keystone-api-types.workspace = true
cadf.workspace = true
openstack-keystone = { version = "0.1", path = "../keystone", default-features = false }
openstack-keystone-config.workspace = true
openstack-keystone-core.workspace = true
openstack-keystone-credential-driver-sql.workspace = true
openstack-keystone-distributed-storage.workspace = true
openstack-keystone-federation-driver-sql.workspace = true
openstack-keystone-k8s-auth-driver-sql.workspace = true
openstack-keystone-token-driver-fernet.workspace = true
openstack-keystone-token-restriction-driver-sql.workspace = true
openstack-keystone-webauthn.workspace = true
oslo-config.workspace = true
percent-encoding.workspace = true
sea-orm = { workspace = true, features = ["runtime-tokio", "runtime-tokio-rustls"] }
sea-orm-migration = { workspace = true, features = ["runtime-tokio", "runtime-tokio-rustls"] }
reqwest = { workspace = true, features = ["json", "query"] }
openstack-keystone-tls-provider.workspace = true
rustls.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
spiffe = { workspace = true, features = ["x509-source"] }
spiffe-rustls = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["mysql", "postgres"]
# Database backends. SQLite is not part of the default set.
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "openstack-keystone/mysql"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "openstack-keystone/postgres"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "openstack-keystone/sqlite"]

[lints]
workspace = true

[dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
httpmock = { workspace = true, features = ["http2"] }
openstack-keystone-credential-driver-sql = { version = "0.1", path = "../credential-driver-sql", features = ["test-support"] }
serde.workspace = true
temp-env.workspace = true
tempfile.workspace = true
