[package]
name = "openstack-keystone-telemetry"
description = "OpenTelemetry configuration and setup for Keystone (ADR 0040)"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# OTLP export (ADR 0040). Off by default: configuration is parsed and
# validated either way, but nothing is exported without it.
#
# `otel` is the usual switch: traces and metrics over OTLP/HTTP (protobuf).
# `otlp-grpc` adds the gRPC transport (tonic); enable it next to `otel`.
default = []
# Test-only helper for pinning rendered exposition text against checked-in
# golden files (ADR 0040). Enable from `[dev-dependencies]` only.
golden = []
otel = ["otlp-http"]
otlp-http = [
  "sdk",
  "opentelemetry-otlp/http-proto",
  "opentelemetry-otlp/reqwest-blocking-client",
  "opentelemetry-otlp/reqwest-rustls",
]
otlp-grpc = [
  "sdk",
  "opentelemetry-otlp/grpc-tonic",
  "opentelemetry-otlp/tls-aws-lc",
  "opentelemetry-otlp/tls-webpki-roots",
]
# Internal: the OTLP exporters, the tracing bridge and the trace signal. The
# metrics SDK is not behind a feature: `/metrics` is rendered from it in every
# build (ADR 0040).
sdk = [
  "dep:http",
  "dep:opentelemetry-otlp",
  "dep:tracing",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
  "opentelemetry/trace",
  "opentelemetry-otlp/trace",
  "opentelemetry-otlp/metrics",
  "opentelemetry_sdk/trace",
]

[dependencies]
http = { workspace = true, optional = true }
inventory.workspace = true
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
oslo-config.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
eyre.workspace = true
openstack-keystone-config.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
