[package]
name = "openstack-keystone-storage-crypto"
description = "Cryptographic primitives for Keystone distributed storage (AES-256-GCM, HKDF, KEK/DEK hierarchy)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true

# This crate intentionally does NOT inherit workspace lints so that it can set
# `unsafe_code = "deny"` (rather than "forbid") for the mlock.rs module, which
# requires unsafe for posix_memalign, mlock/munlock, and raw-pointer access.
# All other workspace crates use `unsafe_code = "forbid"` via the workspace
# default.  All other lint settings below mirror the workspace lints exactly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
enum_glob_use = "deny"
expect_used = "deny"
print_stdout = "deny"
unwrap_used = "deny"
doc_paragraphs_missing_punctuation = "warn"

[features]
default = ["ring"]
# `ring` primitives (AES-GCM, HKDF, HMAC, RNG). Unused, but still compiled,
# when `fips` is also enabled; build with
# `--no-default-features --features fips` to keep it out of this crate.
ring = ["dep:ring"]
# Route all primitives (AES-GCM, HKDF, HMAC, RNG) through the FIPS 140-3
# validated AWS-LC module. Takes precedence over `ring`. Building it needs
# cmake, a C compiler, clang (bindgen) and Go.
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
nix = { workspace = true, features = ["mman", "feature"] }
ring = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
