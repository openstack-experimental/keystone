[package]
name = "openstack-keystone-storage-crypto"
description = "Cryptographic primitives for Keystone distributed storage (AES-256-GCM, HKDF, KEK/DEK hierarchy)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true

# This crate intentionally does NOT inherit workspace lints so that it can set
# `unsafe_code = "deny"` (rather than "forbid") for the mlock.rs module, which
# requires unsafe for posix_memalign, mlock/munlock, and raw-pointer access.
# All other workspace crates use `unsafe_code = "forbid"` via the workspace
# default.  All other lint settings below mirror the workspace lints exactly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
enum_glob_use = "deny"
expect_used = "deny"
print_stdout = "deny"
unwrap_used = "deny"
doc_paragraphs_missing_punctuation = "warn"

[features]
default = ["rustcrypto"]
# Pure-Rust RustCrypto primitives (AES-GCM, HKDF, HMAC). Unused, but still
# compiled, when `fips` is also enabled; build with
# `--no-default-features --features fips` to keep them out of the tree.
rustcrypto = [
  "dep:aes-gcm",
  "dep:hkdf",
  "dep:hmac",
  "dep:hybrid-array",
  "dep:sha2",
]
# Route all primitives (AES-GCM, HKDF, HMAC, RNG) through the FIPS 140-3
# validated AWS-LC module. Takes precedence over the RustCrypto backend.
# Building it needs cmake, a C compiler, clang (bindgen) and Go.
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]

[dependencies]
aws-lc-rs = { version = "1.18", optional = true }
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hybrid-array = { version = "0.4", optional = true }
sha2 = { workspace = true, optional = true }
nix = { workspace = true, features = ["mman", "feature"] }
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = "1"
