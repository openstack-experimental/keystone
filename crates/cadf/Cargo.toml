[package]
name = "cadf"
description = "CADF-compliant audit framework for OpenStack services"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["serde", "now"] }
aws-lc-rs = { workspace = true, optional = true }
openstack-keystone-telemetry.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ring = { workspace = true, optional = true }
openstack-keystone-tls-provider = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, features = ["std"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "fs", "io-util", "macros"] }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
default = ["ring"]
# `ring` primitives (HMAC-SHA256, HKDF-SHA256, RNG).
ring = ["dep:ring"]
# Route HMAC, HKDF and RNG through the FIPS 140-3 validated AWS-LC module.
# Takes precedence over `ring`. Building it needs cmake, a C compiler, clang
# (bindgen) and Go. Build with `--no-default-features --features fips` to keep
# `ring` out of this crate.
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]
testing = []
# Service bootstrap: KEK load/generate, spool sealing, writer, shipper and
# key reloader (`cadf::runtime::init`).
runtime = ["dep:tokio-util"]
# RFC 5424 syslog sink over TCP, optionally wrapped in TLS.
syslog = [
    "dep:openstack-keystone-tls-provider",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "tokio/net",
]

[dev-dependencies]
openstack-keystone-tls-provider.workspace = true
openstack-keystone-telemetry = { workspace = true, features = ["golden"] }
nix = { workspace = true, features = ["user"] }
rcgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
