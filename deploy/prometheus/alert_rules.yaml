# Prometheus alert rules for the Keystone audit subsystem (ADR 0023 Phase 4).
#
# Metrics are scraped from the /metrics endpoint on each Keystone node.
# See crates/cadf/src/metrics.rs for the exposition format.
---
groups:
  - name: keystone_audit
    rules:
      # Fires when the perimeter best-effort channel drops events faster than
      # 100/s AND those drops represent more than 5 % of all audit events.
      # `keystone_audit_events_total` counts only events accepted into a
      # channel, so the total offered load is events + drops.
      # A sustained burst at this level may indicate a volumetric attack; check
      # rate-limiting health (ADR 0022) before investigating audit consumers.
      - alert: KeystoneAuditDropsVolumetric
        expr: |
          rate(keystone_audit_dropped_total[5m]) > 100 and
          rate(keystone_audit_dropped_total[5m]) /
          (rate(keystone_audit_events_total[5m]) + rate(keystone_audit_dropped_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Audit drops >100/s (>5% of perimeter events)"
          description: >
            Possible volumetric attack or audit consumer backlog.
            Check rate limiting (ADR 0022) and the audit spool writer.

      # Fires when any post-audit outcome record (Success/Failure) is lost
      # after a DB commit. The pre-audit Attempt event exists but the final
      # outcome is unknown. Compensating local log entries (structured JSONL)
      # should be independently shipped to the SIEM for dual-delivery.
      - alert: KeystoneAuditPostauditDrops
        expr: |
          increase(keystone_audit_postaudit_dropped_total[5m]) > 0 and
          rate(keystone_audit_events_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Post-audit outcome record lost after DB commit"
          description: >
            The outcome record (Success/Failure) for a high-criticality
            operation (e.g. disable_user, delete_credential) was dropped.
            The pre-audit Attempt exists but the final outcome is lost.
            Compensating local JSONL log entries should be shipped to the
            SIEM as a dual-delivery fallback (see ADR 0023 §Observability).

      # The spool writer failed to append events: each one is lost for good.
      - alert: KeystoneAuditSpoolWriteFailures
        expr: increase(keystone_audit_spool_write_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit events could not be written to the spool"
          description: >
            The spool writer failed to append events (disk full, permissions or
            I/O error). Check `keystone_audit_spool_bytes` and the node logs.

      # A spool segment failed verification or could not be parsed: possible
      # tampering. The segment is kept as *.quarantine-* for investigation.
      - alert: KeystoneAuditSpoolQuarantined
        expr: increase(keystone_audit_spool_quarantined_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Audit spool segment quarantined"
          description: >
            A sealed spool segment contained tampered or unparsable lines.
            Investigate the *.quarantine-* file in the spool directory.

      # The sink keeps rejecting batches, so segments pile up in the spool.
      - alert: KeystoneAuditSinkFailing
        expr: increase(keystone_audit_sink_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit sink delivery is failing"
          description: >
            Batches are being retried with backoff and sealed segments are
            accumulating (see `keystone_audit_spool_bytes`).

      # The writer is not keeping up with the critical (fail-closed) channel.
      - alert: KeystoneAuditCriticalChannelBacklog
        expr: keystone_audit_channel_depth{channel="critical"} > 192
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Audit critical channel is >75% full"
          description: >
            Provider operations will block once the channel (256 events by
            default) is full. Check the spool writer and disk latency.

  # Raft distributed storage (GitHub #1306). Series are exported per node
  # when `[distributed_storage]` is configured; see
  # crates/storage/src/prometheus_metrics.rs.
  - name: keystone_raft
    rules:
      # A partition was quarantined after repeated AES-GCM failures. Reads
      # from it are blocked on this node and `/ready` reports not ready.
      # Follow the "Clearing a Quarantined Partition" runbook.
      - alert: KeystoneRaftPartitionQuarantined
        expr: keystone_raft_quarantined_partitions_count > 0
        labels:
          severity: critical
        annotations:
          summary: "Raft partition quarantined on {{ $labels.instance }}"
          description: >
            Repeated GCM tag verification failures quarantined a storage
            partition. Investigate disk corruption or tampering before
            clearing the quarantine.

      # First GCM failure (the runbook's "metric increment" stage).
      - alert: KeystoneRaftGcmFailures
        expr: increase(keystone_raft_gcm_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "AES-GCM verification failures on {{ $labels.instance }}"
          description: >
            Encrypted state failed tag verification. Three failures within
            60 seconds quarantine the partition.

      # `keystone_raft_term` is 0 until the node has observed Raft state,
      # so a node that started but has not yet joined the cluster (or never
      # will, if misconfigured) does not page.
      - alert: KeystoneRaftNoLeader
        expr: keystone_raft_current_leader_id < 0 and keystone_raft_term > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No Raft leader known on {{ $labels.instance }}"
          description: >
            The node is partitioned or the cluster lost quorum; writes and
            linearizable reads fail.

      - alert: KeystoneRaftApplyLag
        expr: keystone_raft_apply_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Raft apply lag above 1000 entries on {{ $labels.instance }}"
          description: >
            The state machine trails the cluster commit index; the node is
            not ready and serves no traffic until it catches up.

      # Fewer than 10% of the 2^31 log nonces remain. The node stops
      # accepting log appends once the counter reaches 2^31.
      - alert: KeystoneRaftNonceBudgetLow
        expr: keystone_raft_log_nonce_remaining < 214748364
        labels:
          severity: warning
        annotations:
          summary: "Log nonce budget below 10% on {{ $labels.instance }}"
          description: >
            The log-encryption nonce counter approaches 2^31, after which
            this node rejects log appends. Plan a DEK rotation per the
            distributed storage guide.

      # Per-record write version at 90% of the 2^30 limit (invariant 9).
      - alert: KeystoneRaftWriteRateVersionHigh
        expr: keystone_raft_write_rate_version_max > 966367641
        labels:
          severity: warning
        annotations:
          summary: "Per-record write version near limit on {{ $labels.instance }}"
          description: >
            A record approaches the 2^30 write limit; rotate the DEK.

      - alert: KeystoneRaftReencryptSkipped
        expr: keystone_raft_dek_reencrypt_last_skipped > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "DEK re-encryption left records behind on {{ $labels.instance }}"
          description: >
            The last background re-encryption pass skipped records; the
            retired DEK cannot be dropped until they are migrated.
