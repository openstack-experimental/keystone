# Single-voter Raft KEK smoke tests on k3s. Kept apart from skaffold.yaml
# because skaffold requires artifact image names to be unique across all
# configs loaded from one file. Deploy with one of:
#
#   skaffold run -f skaffold-k3s-test.yaml -p pkcs11 --default-repo localhost:5000
#   skaffold run -f skaffold-k3s-test.yaml -p tpm --default-repo localhost:5000
#
# The tpm profile needs /tmp/keystone-tpm-kek.ctx and
# /tmp/keystone-tpm-kek.ctx.hmac provisioned first.
#
# See doc/src/contributor/development.md for the full walk-through.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: keystone-k3s-test
build:
  insecureRegistries:
    - localhost:5000
  artifacts:
    - image: keystone-rs
      context: .
      docker:
        dockerfile: Dockerfile
        buildArgs:
          KEYSTONE_FEATURES: "openstack-keystone/pkcs11,openstack-keystone/tpm"
          KEYSTONE_TEST_TOOLS: "softhsm2 opensc swtpm tpm2-tools"
    - image: keystone-opa
      context: .
      docker:
        dockerfile: Dockerfile.opa
  local:
    useDockerCLI: true
    concurrency: 0
    push: true

deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  kubectl:
    flags:
      apply: ["--wait"]
    hooks:
      after:
        - host:
            command:
              - sh
              - -c
              - |
                kubectl -n keystone-raft-test wait --for=condition=complete job/keystone-bootstrap --timeout=180s
                kubectl -n keystone-raft-test wait --for=condition=ready pod -l app.kubernetes.io/name=keystone-rs --timeout=180s

profiles:
  - name: pkcs11
    manifests:
      kustomize:
        paths:
          - tools/k8s/keystone/overlays/k3s-test/pkcs11
    patches:
      - op: add
        path: /deploy/kubectl/hooks/before
        value:
          - host:
              command:
                - sh
                - -c
                - |
                  kubectl create namespace keystone-raft-test --dry-run=client -o yaml | kubectl apply -f -
                  kubectl -n keystone-raft-test delete job keystone-bootstrap --ignore-not-found --wait --timeout=30s
                  kubectl -n keystone-raft-test create secret generic keystone-pkcs11-pin \
                    --from-literal=pin=12345678 --dry-run=client -o yaml | kubectl -n keystone-raft-test apply -f -
  - name: tpm
    manifests:
      kustomize:
        paths:
          - tools/k8s/keystone/overlays/k3s-test/tpm
    patches:
      - op: add
        path: /deploy/kubectl/hooks/before
        value:
          - host:
              command:
                - sh
                - -c
                - |
                  test -f /tmp/keystone-tpm-kek.ctx
                  test -f /tmp/keystone-tpm-kek.ctx.hmac
                  kubectl create namespace keystone-raft-test --dry-run=client -o yaml | kubectl apply -f -
                  kubectl -n keystone-raft-test delete job keystone-bootstrap --ignore-not-found --wait --timeout=30s
                  kubectl -n keystone-raft-test create secret generic keystone-tpm-kek \
                    --from-file=kek.ctx=/tmp/keystone-tpm-kek.ctx \
                    --from-file=kek.ctx.hmac=/tmp/keystone-tpm-kek.ctx.hmac \
                    --dry-run=client -o yaml | kubectl -n keystone-raft-test apply -f -
