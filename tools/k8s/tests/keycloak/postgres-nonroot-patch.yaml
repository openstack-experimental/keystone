# Run postgres as its own user so the image entrypoint skips `gosu`. On
# ubuntu-26.04 CI runners (kernel 7.0 azure) gosu hangs in a sched_yield
# loop before exec'ing postgres, leaving the port closed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # On ubuntu-26.04 runners signals between processes in the container
        # fail with EPERM (startup -> checkpointer), breaking crash recovery.
        # Suspected AppArmor signal mediation.
        appArmorProfile:
          type: Unconfined
      containers:
        - name: postgres
          env:
            # emptyDir is root-owned: initdb can't chmod it as uid 999, so
            # keep the cluster in a subdirectory created by postgres itself.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
