apiVersion: v1
kind: ConfigMap
metadata:
  name: keystone-soak
data:
  # Run length: `30m`, `24h`, `7d`, ... (`0` = until stopped).
  SOAK_DURATION: "24h"
  SOAK_INTERVAL: "30s"
  SOAK_HOST: "http://keystone-rs:8080"
  SOAK_METRICS_SERVICE: "keystone-rs-internal"
  SOAK_METRICS_PORT: "8099"
  SOAK_EXPECTED_VOTERS: "3"
  SOAK_PHASES: "steady:5m,burst:1m,idle:5m"
  SOAK_STEADY_USERS: "20"
  SOAK_BURST_USERS: "100"
  # Keep serving `/verdict` and `/metrics` after the run finished.
  SOAK_LINGER: "1h"
  # Credentials of the bootstrap admin in the dev stack. Replace for other
  # environments (use a Secret).
  OS_AUTH_URL: "http://keystone-rs:8080/v3"
  OS_USERNAME: "admin"
  OS_PASSWORD: "password"
  OS_USER_DOMAIN_NAME: "default"
  OS_PROJECT_NAME: "admin"
  OS_PROJECT_DOMAIN_NAME: "default"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-soak
  labels:
    app.kubernetes.io/name: keystone-soak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keystone-soak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keystone-soak
    spec:
      containers:
        - name: soak
          image: keystone-soak
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: keystone-soak
          ports:
            - containerPort: 9100
              name: soak-metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: soak-metrics
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: keystone-soak
  labels:
    app.kubernetes.io/name: keystone-soak
spec:
  selector:
    app.kubernetes.io/name: keystone-soak
  ports:
    - name: soak-metrics
      port: 9100
      targetPort: soak-metrics
