# The production storage-operator config points at the `keystone` namespace;
# the smoke test runs in `keystone-raft-test`. The deployment ships scaled to
# 0 and the CLI never opens the KEK, so the provider section only needs to
# validate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keystone-storage-operator
data:
  site.toml: |
    [auth]
    methods = "password"
    [database]
    connection = "postgresql://unused:unused@localhost/unused"
    [distributed_storage]
    node_id = 1000
    node_cluster_addr = "https://keystone-rs-0.keystone-rs-internal.keystone-raft-test.svc.cluster.local:8300"
    node_listener_addr = "0.0.0.0:8300"
    path = "/tmp/storage"
    trust_domains = "example.org"
    allowed_peer_svids = ["spiffe://example.org/keystone/storage/node"]
    kek_provider = "pkcs11"
    [distributed_storage.pkcs11]
    pkcs11_module_path = "/nonexistent"
    pkcs11_slot_label = "unused"
    pkcs11_key_label = "unused"
    pkcs11_pin_file = "/dev/null"
