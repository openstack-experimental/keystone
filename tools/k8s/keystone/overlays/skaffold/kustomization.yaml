
configMapGenerator:
  - name: keystone
    behavior: replace
    files:
      - conf/keystone.conf

resources:
  - ../../base

images:
  - name: keystone-rs
    newName: keystone-rs
  - name: busybox
    newName: busybox

replicas:
  - name: keystone-rs
    count: 2

patches:
  - target:
      kind: StatefulSet
      name: keystone-rs
    path: statefulset-dev-patch.yaml
  # DPoP nonces, replay cache and the per-domain mode cache are per replica:
  # keep each client (e.g. the api tests) on one replica.
  - target:
      kind: Service
      name: keystone-rs
    patch: |-
      - op: add
        path: /spec/sessionAffinity
        value: ClientIP
  # `public_endpoint` is http://keystone-rs.local (port 80): serve it on the
  # service as well, so in-cluster clients using that name get through.
  - target:
      kind: Service
      name: keystone-rs
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: http-public
          port: 80
          protocol: TCP
          targetPort: 8080
