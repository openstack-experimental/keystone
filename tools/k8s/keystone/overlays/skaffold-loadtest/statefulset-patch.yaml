apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keystone-rs
spec:
  template:
    spec:
      initContainers:
        # Same site.toml as the skaffold overlay, without the WASM auth
        # plugins: the plugin invocation limits (600 per minute per source)
        # answer 429 to the application credential logins of a load test.
        - name: identity-generator
          args:
            - |
              NODE_ID=$(echo $POD_NAME | grep -o '[0-9]\+$')
              cat <<EOF > /etc/keystone/site.toml
              [auth]
              methods = "password,token,openid,application_credential,x509,mapped,ec2credential"
              [distributed_storage]
              node_id = $NODE_ID
              node_cluster_addr = "https://$POD_NAME.keystone-rs-internal.default.svc.cluster.local:8300"
              node_listener_addr = "0.0.0.0:8300"
              path = "/storage"
              trust_domains = "example.org"
              allowed_peer_svids = ["spiffe://example.org/keystone/storage/node"]
              dev_mode = true
              retry_join_nodes = "0=https://keystone-rs-0.keystone-rs-internal.default.svc.cluster.local:8300,1=https://keystone-rs-1.keystone-rs-internal.default.svc.cluster.local:8300,2=https://keystone-rs-2.keystone-rs-internal.default.svc.cluster.local:8300"
              EOF
              cat /etc/keystone/site.toml
      containers:
        - name: keystone
          resources:
            requests:
              cpu: "4"
            limits:
              cpu: "24"
          env:
            - name: LD_PRELOAD
              value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
            - name: MALLOC_CONF
              value: background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:0
            - name: OS_OTEL__ENABLED
              value: "false"
            - name: OS_OTEL__METRICS_ENABLED
              value: "false"
            - name: OS_RESOURCE__CACHING
              value: "true"
            - name: OS_DATABASE__MAX_POOL_SIZE
              value: "60"
            # As wide as keystone-py's worker processes, and queue instead of
            # answering 503 when the hashing pool is busy.
            - name: OS_IDENTITY__PASSWORD_HASHING_THREADS
              value: "24"
            - name: OS_IDENTITY__PASSWORD_HASHING_QUEUE_FULL
              value: wait
