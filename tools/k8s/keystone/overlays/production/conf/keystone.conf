[DEFAULT]
debug = false
use_stderr = true
log_dir = /var/log/keystone

[auth]
methods = password,token,openid,application_credential,x509,mapped

[api_policy]
opa_base_url = unix:///var/opa/opa.sock

[webauthn]
enabled = true
driver = raft
relying_party_id = local
relying_party_origin = https://keystone.local
relying_party_name = keystone

# Placeholder trust domain: replace every `example.org` in this overlay with
# your SPIRE trust domain. The SPIRE registrations in spire/ use
# {{ .TrustDomain }} and adapt automatically; these keystone-side values must
# match it or intra-cluster mTLS and admin auth fail silently.
[interface_internal]
tcp_address = 0.0.0.0:8215
type = "spiffe"
trust_domains = "example.org"

# Admin interface (unix socket, same-pod clients only). The admin SVID is the
# default identity of the keystone-rs pods: their dedicated `keystone-rs`
# service account in the `keystone` namespace (see spire/).
[interface_admin]
socket_path = /run/keystone/admin.sock
trust_domains = example.org
admin_svid = spiffe://example.org/ns/keystone/sa/keystone-rs

# Replace with a deployment-specific random value (e.g. `openssl rand -hex 32`).
[mapping]
cluster_salt = "fbb27433d07ab307cc1fc899d0e174cf197fd398fbcff7285a63fe2f94eec2fe"

[cache]
enabled = true
backend = dogpile.cache.memcached
memcache_servers = memcached:11211
