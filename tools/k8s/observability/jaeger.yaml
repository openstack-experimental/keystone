# Jaeger v2 all-in-one with in-memory storage: traces are lost on restart,
# which is fine for development. Accepts OTLP/HTTP on 4318 and OTLP/gRPC on
# 4317, serves the UI and query API on 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.9.0
          env:
            # Listen on all interfaces, not only localhost.
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 16686
              name: ui
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
