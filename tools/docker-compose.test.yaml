services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    container_name: tools_postgres
    environment:
      POSTGRES_PASSWORD: password
    tmpfs: /var/lib/postgresql
    ports:
      - "15432:5432"

  mysql:
    image: public.ecr.aws/docker/library/mysql:26.10
    container_name: tools_mysql
    environment:
      MYSQL_DATABASE: test_db
      MYSQL_ROOT_PASSWORD: password
    tmpfs: /var/lib/mysql
    ports:
      - "13306:3306"
